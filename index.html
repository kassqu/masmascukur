        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600; const MAX_HEIGHT = 600;
                        let width = img.width; let height = img.height;
                        if (width > height && width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } 
                        else if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5)); 
                    };
                };
            });
        };

        const callGasApi = async (payload) => {
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (err) {
                console.warn('Gagal koneksi ke server, menggunakan mode offline:', err);
                return { status: 'offline' };
            }
        };

        function AdminAuthModal({ onClose, onConfirm, showAlert }) {
            const [pin, setPin] = useState('');
            const [loading, setLoading] = useState(false);
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const result = await callGasApi({ action: 'VERIFY_ADMIN_PIN', pin: pin });
                    if (result.status === 'success' && result.valid) { 
                        onConfirm();
                    } else {
                        showAlert('PIN Admin salah atau tidak valid!', 'error');
                        setPin('');
                    }

                } finally {
                    setLoading(false);
                }
            };

            const [customerPhone, setCustomerPhone] = useState('');
            const [pickupDate, setPickupDate] = useState(new Date().toISOString().split('T')[0]);
            const [pickupTime, setPickupTime] = useState('10:00');
            const [selectedService, setSelectedService] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const activeQueue = transactions
                .filter(t => t.progressStatus !== 'Selesai')
                .sort((a, b) => new Date(a.pickupDate || 0) - new Date(b.pickupDate || 0));

            const handleBooking = async (e) => {
                e.preventDefault();
                if(!selectedService) { showAlert('Pilih layanan terlebih dahulu!', 'error'); return; }
                
                setIsSubmitting(true);
                const service = products.find(p => p.id == selectedService);
                const todayStr = new Date().toISOString().split('T')[0];
                const todayTrx = transactions.filter(t => t.date && t.date.startsWith(todayStr));
                const queueNumber = todayTrx.length + 1;
                
                const finalPrice = (service.price || 0) - (service.discount || 0);
                const fullPickupDateTime = `${pickupDate}T${pickupTime}:00`;
                const newTrx = {
                    id: `BKG-${Date.now().toString().slice(-6)}`,
                    customer: customerName,
                    customerPhone: customerPhone,
                    items: [{ ...service, qty: 1 }],
                    total: finalPrice > 0 ? finalPrice : service.price,
                    discount: service.discount || 0,
                    status: 'Belum Lunas',
                    date: new Date().toISOString(),
                    pickupDate: fullPickupDateTime,
                    queueNumber: queueNumber,
                    progressStatus: 'Menunggu Antrean',
                    paymentMethod: '-', amountReceived: 0, change: 0
                };
                
                await onSaveTransaction(newTrx);
                setIsSubmitting(false);
                showAlert(`Booking Berhasil! Nomor Antrean Anda: ${queueNumber}`, 'success');
                
                // Kirim Notifikasi WA Otomatis ke Admin
                const adminNumber = settings?.adminPhone || settings?.phone || '6281234567890';

                               `Estimasi Durasi: *30 - 45 Menit*\n\n` +
                               `Mohon disiapkan, terima kasih!`;

                                <a href="#booking" className="bg-white text-emerald-900 px-8 py-3.5 rounded-2xl font-black uppercase tracking-wider shadow-lg hover:scale-105 active:scale-95 transition-all">Booking Sekarang</a>

        function LaporanView({ transactions, onDeleteTransaction, onUpdateTransaction, formatRupiah, searchQuery, onLoadToKasir, settings, showAlert }) {

                const d = t.date ? new Date(t.date) : new Date(); 
                if (filterPreset === 'hari-ini') { const dDate = new Date(d); dDate.setHours(0, 0, 0, 0); return dDate.getTime() === today.getTime(); }

                else if (filterPreset === 'bulanan') { const lastMonth = new Date(today); lastMonth.setDate(today.getDate() - 30); return d >= lastMonth; } 
                else if (filterPreset === 'kalender') { if (startDate && d < new Date(startDate)) return false; if (endDate && d > new Date(endDate+"T23:59:59")) return false; return true; }
                return true;

                        <div className="border-y-2 border-dashed border-slate-300 py-3 mb-4 space-y-1.5">
                            <div className="flex justify-between items-center"><span className="text-sm font-black bg-slate-800 text-white px-2 py-0.5 rounded">ANTREAN: {data.queueNumber || '-'}</span><span className="text-[10px] text-slate-500">{data.id}</span></div>
                            <div className="flex justify-between mt-2"><span>Tgl Nota:</span><span>{data.date ? new Date(data.date).toLocaleDateString('id-ID') : '-'}</span></div>
                            <div className="flex justify-between"><span>Pelanggan:</span><span className="font-bold">{data.customer || 'Pelanggan'}</span></div>
                            {data.pickupDate && <div className="text-center text-xs font-black text-slate-800 border-t-2 border-dashed border-slate-300 mt-3 pt-2">Jadwal: {new Date(data.pickupDate).toLocaleDateString('id-ID')}</div>}
                        </div>
                        <div className="space-y-3 mb-4">{(data.items || []).map((i,x)=><div key={x}><div className="font-bold uppercase">{i.name}</div><div className="flex justify-between text-slate-600 mt-0.5"><span>{i.qty}x @ {formatRupiah(i.price)}</span><span>{formatRupiah(i.price*i.qty)}</span></div></div>)}</div>
                        <div className="border-t-2 border-dashed border-slate-300 pt-3 space-y-1.5">
                            <div className="flex justify-between font-medium"><span>Subtotal</span><span>{formatRupiah(data.total + (data.discount || 0))}</span></div>
                            {data.discount > 0 && <div className="flex justify-between font-medium"><span>Diskon</span><span>-{formatRupiah(data.discount)}</span></div>}
                            <div className="flex justify-between font-black text-base mt-2 pt-2 border-t border-slate-200"><span>TOTAL</span><span>{formatRupiah(data.total || 0)}</span></div>
                            <div className="flex justify-between mt-4"><span>Status:</span><span className={`font-black uppercase ${data.status === 'Lunas' ? '' : 'text-slate-500'}`}>{data.status || '-'} {data.paymentMethod && data.status === 'Lunas' ? `(${data.paymentMethod})` : ''}</span></div>
                            {data.status === 'Lunas' && data.amountReceived > 0 && (<><div className="flex justify-between text-slate-500"><span>Diterima:</span><span>{formatRupiah(data.amountReceived)}</span></div><div className="flex justify-between text-slate-500"><span>Kembali:</span><span>{formatRupiah(data.change || 0)}</span></div></>)}
                        </div>
                        <div className="text-center mt-8 text-slate-600 font-bold whitespace-pre-wrap">{settings?.receiptFooter || '*** TERIMA KASIH ***'}</div>
                    </div>
                    
                    <div className="p-4 bg-slate-50 grid grid-cols-2 gap-3 border-t border-slate-200 print:hidden">
                        <button onClick={handleWA} className="py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-sm transition-colors"><Icon name="MessageCircle" size={16}/> Kirim WA</button>
                        <button onClick={()=>window.print()} className="py-3 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-sm transition-colors"><Icon name="Printer" size={16}/> Simpan/Cetak</button>
                        <button onClick={() => showAlert('Fitur Bluetooth Print (Thermal) membutuhkan instalasi/pairing aplikasi ekstensi seperti RawBT atau ESC POS print service di HP kasir.', 'info')} className="py-3 bg-slate-800 hover:bg-slate-900 text-white col-span-2 rounded-xl font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-sm transition-colors"><Icon name="Bluetooth" size={16}/> Print Thermal (Bluetooth)</button>
                        <button onClick={onClose} className="py-3 bg-slate-200 hover:bg-slate-300 text-slate-800 col-span-2 rounded-xl font-black text-xs uppercase tracking-wider transition-colors">Tutup Nota</button>

                <style dangerouslySetInnerHTML={{__html: `@media print { body * { visibility: hidden; } #receipt-content, #receipt-content * { visibility: visible; } #receipt-content { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; background: white; } }`}} /></div>

        function NavItem({ icon, label, isActive, onClick }) {
            return (<button onClick={onClick} className={`flex flex-col items-center justify-center w-16 transition-colors ${isActive ? 'text-emerald-700' : 'text-slate-400 hover:text-slate-600'}`}><div className={`transition-transform ${isActive ? 'scale-110 mb-1' : 'scale-100 mb-0'}`}>{icon}</div><span className={`text-[10px] font-black uppercase tracking-wider transition-opacity ${isActive ? 'opacity-100' : 'opacity-0 h-0'}`}>{label}</span></button>);
        }

        function App() {
            const [appMode, setAppMode] = useState('splash');
            const [isDbLoading, setIsDbLoading] = useState(false);
            
            const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('kassqu_user') !== null);
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('kassqu_user');
                return saved ? JSON.parse(saved) : null;
            });
            const [activeTab, setActiveTab] = useState(() => localStorage.getItem('kassqu_tab') || 'dashboard');
            
            const [searchQuery, setSearchQuery] = useState('');
            
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('kassqu_settings');
                return saved ? JSON.parse(saved) : INITIAL_SETTINGS;
            });

            const [products, setProducts] = useState(INITIAL_PRODUCTS);
            const [transactions, setTransactions] = useState([]);

            const [loginError, setLoginError] = useState('');
            const [editingTrx, setEditingTrx] = useState(null);

            const [showAuthModal, setShowAuthModal] = useState(false);
            const [pendingAuthAction, setPendingAuthAction] = useState(null);

            const [appAlert, setAppAlert] = useState(null); 
            const showAlert = (message, type = 'error') => { setAppAlert({ message, type }); };

            useEffect(() => { localStorage.setItem('kassqu_tab', activeTab); }, [activeTab]);

            useEffect(() => {
                let isMounted = true;
                const fetchInitialData = async () => {
                    const result = await callGasApi({ action: 'GET_DATA' });
                    if (result.status === 'success' && isMounted) {
                        if (result.data.settings && Object.keys(result.data.settings).length > 0) {
                            setSettings(result.data.settings);
                            localStorage.setItem('kassqu_settings', JSON.stringify(result.data.settings));
                        }
                        if (result.data.products && result.data.products.length > 0) setProducts(result.data.products);
                        if (result.data.transactions) setTransactions(result.data.transactions);
                    } else {
                        const localTrx = localStorage.getItem('kassqu_transactions');
                        if (localTrx) setTransactions(JSON.parse(localTrx));
                    }
                };

                fetchInitialData();

                // Timer transisi dari splash screen ke mode landing page publik
                setTimeout(() => {
                    if (isMounted) {
                        const savedUser = localStorage.getItem('kassqu_user');
                        setAppMode(savedUser ? 'cashier' : 'landing');
                    }
                }, 1500);
                
                return () => { isMounted = false; };
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsDbLoading(true);
                setLoginError('');
                
                const formData = new FormData(e.target);
                const user = formData.get('username');
                const pass = formData.get('password');

                const result = await callGasApi({ action: 'VERIFY_LOGIN', username: user, password: pass });
                
                if (result.status === 'success') {
                    setCurrentUser(result.user);
                    localStorage.setItem('kassqu_user', JSON.stringify(result.user));
                    setIsLoggedIn(true); 
                    setAppMode('cashier');
                } else {
                    setLoginError(result.message || 'Username/Password salah!');
                }
                setIsDbLoading(false);
            };

            const requestAuth = (actionCallback) => {
                const currentKode = String(currentUser?.kodeKasir || '').toLowerCase();
                if (currentKode === 'admin' || currentKode.includes('admin')) {
                    actionCallback();
                } else {
                    setPendingAuthAction(() => actionCallback);
                    setShowAuthModal(true);
                }
            };

            const updateSettingsDb = async (newData) => { 
                setSettings(newData);
                localStorage.setItem('kassqu_settings', JSON.stringify(newData)); 
                await callGasApi({ action: 'SAVE_SETTINGS', data: newData });
            };
            const saveProductDb = async (prod) => {
                const newProds = products.find(p => p.id === prod.id) ? products.map(p => p.id === prod.id ? prod : p) : [...products, prod];
                setProducts(newProds); 
                await callGasApi({ action: 'SAVE_PRODUCT', data: prod });
            };
            const deleteProductDb = async (id) => { 
                setProducts(products.filter(p => p.id !== id)); 
                await callGasApi({ action: 'DELETE_PRODUCT', id: id });
            };
            const saveTransactionDb = async (trx) => {
                const newTrxs = transactions.find(t => t.id === trx.id) ? transactions.map(t => t.id === trx.id ? trx : t) : [...transactions, trx];
                setTransactions(newTrxs); 
                localStorage.setItem('kassqu_transactions', JSON.stringify(newTrxs));
                await callGasApi({ action: 'SAVE_TRANSACTION', data: trx });
            };
            const deleteTransactionDb = async (id) => { 
                setTransactions(transactions.filter(t => t.id !== id)); 
                try { await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'DELETE_TRANSACTION', id: id }) }); } catch (e) { console.error(e); }
            };

            const formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

            if (appMode === 'splash') {
                return (
                    <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center text-white bg-gray-900 touch-none overscroll-none" style={{ backgroundImage: `url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=2074&auto=format&fit=crop')`, backgroundSize: 'cover', backgroundPosition: 'center' }}>
                        <div className="absolute inset-0 bg-gray-900/70 backdrop-blur-md"></div>
                        <div className="relative z-10 flex flex-col items-center animate-in fade-in duration-700">
                            <div className="w-24 h-24 bg-white rounded-3xl flex items-center justify-center shadow-2xl border-4 border-emerald-500/30 mb-4 p-2 overflow-hidden">
                                <img src={KASSQU_LOGO} alt="KassQu Logo" className="w-full h-full object-contain" onError={(e) => { e.target.onerror = null; e.target.parentElement.innerHTML = '<span class="text-5xl font-black text-emerald-600 tracking-tighter italic">KQ</span>'; }} />
                            </div>
                            <h1 className="text-4xl md:text-5xl font-black tracking-tight drop-shadow-lg text-white mb-1">KassQu</h1>
                            <p className="text-xs font-bold tracking-[0.3em] uppercase text-emerald-400 mb-10">POS System </p>
                            <div className="w-10 h-10 rounded-full animate-spin border-[4px] border-white/20 border-t-emerald-500"></div>
                        </div>
                    </div>
                );
            }

            if (appMode === 'landing') {
                return <LandingView settings={settings} products={products} transactions={transactions} onSaveTransaction={saveTransactionDb} onGoToLogin={() => setAppMode('login')} formatRupiah={formatRupiah} showAlert={showAlert} />;
            }

            if (appMode === 'login') {
                return (
                    <div className="fixed inset-0 z-50 flex flex-col justify-center items-center p-4 font-sans bg-gray-900 overflow-y-auto overscroll-none" style={{ backgroundImage: `url('${LOGIN_BG_IMAGE}')`, backgroundSize: 'cover', backgroundPosition: 'center' }}>
                        <div className="absolute inset-0 bg-gradient-to-b from-gray-900/40 to-gray-900/80 backdrop-blur-[4px]"></div>
                        <div className="relative z-10 bg-white/10 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20">
                            <button onClick={() => setAppMode('landing')} className="absolute top-4 left-4 text-white/70 hover:text-white flex items-center gap-1 text-xs font-bold bg-white/10 px-3 py-1.5 rounded-lg transition-colors backdrop-blur-sm"><Icon name="Home" size={14}/> Batal</button>
                            <div className="text-center mb-6 flex flex-col items-center mt-2">
                                <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-4 shadow-xl border-4 border-white/30 overflow-hidden p-1.5">
                                    <img src={settings?.logo || KASSQU_LOGO} alt="Logo Toko" className="w-full h-full object-contain" />
                                </div>
                                <h1 className="text-2xl font-black text-white tracking-wide uppercase drop-shadow-md leading-tight">{settings?.storeName || 'SISTEM KASIR'}</h1>
                                <p className="text-gray-300 text-sm mt-2 font-medium">Masuk ke Sistem Barbershop</p>
                            </div>
                            {loginError && <div className="mb-4 p-3 bg-red-100/90 text-red-700 rounded-lg text-sm font-bold flex justify-center text-center gap-2 border border-red-200"><Icon name="XCircle" size={16} className="shrink-0 mt-0.5" /> <span>{loginError}</span></div>}
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="text" name="username" placeholder="Username" required className="w-full px-4 py-3 rounded-xl border border-white/30 focus:ring-2 focus:ring-emerald-400 outline-none bg-white/80 text-gray-800 placeholder-gray-500 font-medium" />
                                <input type="password" name="password" placeholder="Password" required className="w-full px-4 py-3 rounded-xl border border-white/30 focus:ring-2 focus:ring-emerald-400 outline-none bg-white/80 text-gray-800 placeholder-gray-500 font-medium" />
                                <button type="submit" disabled={isDbLoading} className="w-full bg-gradient-to-r from-emerald-600 to-emerald-700 disabled:opacity-70 text-white font-bold py-3.5 rounded-xl shadow-lg border border-emerald-500/50 hover:shadow-emerald-500/50 transition-all">{isDbLoading ? 'Memproses...' : 'Login Kasir'}</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-[100dvh] bg-gray-50 flex flex-col font-sans pb-[calc(82px+env(safe-area-inset-bottom))] print:pb-0 print:bg-white">
                    <header className="bg-emerald-800 shadow-sm sticky top-0 z-20 print:hidden" style={{ paddingTop: 'calc(12px + env(safe-area-inset-top, 0px))', paddingBottom: '12px' }}>
                        <div className="max-w-[1920px] mx-auto px-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                {settings?.logo ? <img src={settings.logo} alt="Logo" className="w-10 h-10 object-cover rounded-full border border-gray-250" /> : <div className="w-10 h-10 bg-emerald-700 text-white rounded-full flex items-center justify-center font-bold"><Icon name="Scissors" size={20} /></div>}
                                <div><h1 className="font-bold text-gray-800 text-sm sm:text-lg leading-tight uppercase tracking-tight">{settings?.storeName || 'Mas-Mas Cukur'}</h1><p className="text-[10px] text-gray-500 font-medium flex items-center gap-1"><Icon name="UserCircle" size={12}/> {currentUser?.namaKasir || 'Staff'}</p></div>
                            </div>
                            <div className="hidden sm:flex flex-1 max-w-lg mx-8 relative">
                                <Icon name="Search" className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" size={18} />
                                <input type="text" placeholder="Cari pesanan, produk..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-11 pr-4 py-2.5 bg-gray-100 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm transition-all"/>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setActiveTab('landing')} className="text-emerald-700 hover:bg-emerald-50 transition-colors p-2 flex items-center gap-1.5 text-sm font-bold bg-emerald-50/50 rounded-lg border border-emerald-100" title="Lihat Homepage Publik">
                                    <Icon name="Home" size={18} /> <span className="hidden sm:inline">Homepage</span>
                                </button>
                                <button onClick={() => { setIsLoggedIn(false); setCurrentUser(null); localStorage.removeItem('kassqu_user'); localStorage.removeItem('kassqu_tab'); setActiveTab('landing'); }} className="text-gray-500 hover:text-red-500 transition-colors p-2 flex items-center gap-1.5 text-sm font-bold bg-gray-50 hover:bg-red-50 rounded-lg">
                                    <Icon name="LogOut" size={18} /> <span className="hidden sm:inline">Keluar</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-[1920px] mx-auto w-full p-4 md:p-6 print:p-0">
                        {activeTab === 'dashboard' && <DashboardView transactions={transactions} formatRupiah={formatRupiah} settings={settings} onSaveSettings={updateSettingsDb} requestAuth={requestAuth} />}
                        {activeTab === 'produk' && <ProdukView products={products} onSaveProduct={saveProductDb} onDeleteProduct={deleteProductDb} formatRupiah={formatRupiah} searchQuery={searchQuery} compressImage={compressImage} settings={settings} onSaveSettings={updateSettingsDb} showAlert={showAlert} />}
                        {activeTab === 'kasir' && <KasirView products={products} transactions={transactions} onSaveTransaction={saveTransactionDb} formatRupiah={formatRupiah} parseThousand={parseThousand} formatThousand={formatThousand} searchQuery={searchQuery} settings={settings} editingTrx={editingTrx} clearEditingTrx={() => setEditingTrx(null)} showAlert={showAlert} />}
                        {activeTab === 'laporan' && <LaporanView transactions={transactions} onDeleteTransaction={deleteTransactionDb} onUpdateTransaction={saveTransactionDb} formatRupiah={formatRupiah} searchQuery={searchQuery} onLoadToKasir={(trx)=>{setEditingTrx(trx); setActiveTab('kasir');}} settings={settings} showAlert={showAlert} />}
                        {activeTab === 'setup' && <SetupView settings={settings} onSaveSettings={updateSettingsDb} compressImage={compressImage} />}
                    </main>

                    <nav className="fixed bottom-[calc(6px+env(safe-area-inset-bottom,0px))] left-4 right-4 max-w-xl mx-auto bg-white border border-gray-100 shadow-[0_8px_30px_rgba(0,0,0,0.12)] flex justify-around items-center h-16 z-30 px-2 sm:px-6 rounded-2xl print:hidden animate-in slide-in-from-bottom-5">
                        <NavItem icon={<Icon name="Home" size={24} />} label="Dashboard" isActive={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                        <NavItem icon={<Icon name="Package" size={24} />} label="Layanan" isActive={activeTab === 'produk'} onClick={() => requestAuth(() => setActiveTab('produk'))} />
                        <div className="-mt-6 relative flex flex-col items-center">
                            <button onClick={() => setActiveTab('kasir')} className={`w-14 h-14 rounded-full flex items-center justify-center shadow-lg text-white transition-transform hover:scale-105 active:scale-95 ${activeTab === 'kasir' ? 'bg-emerald-800 ring-4 ring-emerald-100' : 'bg-emerald-600'}`}><Icon name="ShoppingCart" size={26} /></button>
                            <span className={`text-[10px] font-bold mt-1 ${activeTab === 'kasir' ? 'text-emerald-800' : 'text-gray-500'}`}>KASIR</span>
                        </div>
                        <NavItem icon={<Icon name="FileText" size={24} />} label="Laporan" isActive={activeTab === 'laporan'} onClick={() => setActiveTab('laporan')} />
                        <NavItem icon={<Icon name="Settings" size={24} />} label="Setup" isActive={activeTab === 'setup'} onClick={() => requestAuth(() => setActiveTab('setup'))} />
                    </nav>

                    {appAlert && (
                        <div className="fixed inset-0 bg-black/60 z-[110] flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl animate-in zoom-in-95 duration-200 text-center border border-gray-100">
                                <div className={`w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 ${appAlert.type === 'error' ? 'bg-red-50 text-red-500' : appAlert.type === 'info' ? 'bg-emerald-50 text-emerald-500' : 'bg-green-50 text-green-500'}`}>
                                    <Icon name={appAlert.type === 'error' ? 'XCircle' : 'CheckCircle2'} size={32} />
                                </div>
                                <h3 className="font-bold text-gray-800 text-lg mb-2">Info</h3>
                                <p className="text-xs text-gray-500 mb-6 leading-relaxed">{appAlert.message}</p>
                                <button onClick={() => setAppAlert(null)} className={`w-full text-white font-bold py-3 rounded-2xl shadow-lg active:scale-95 transition-all text-sm ${appAlert.type === 'error' ? 'bg-red-600 hover:bg-red-700 shadow-red-100' : 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-100'}`}>Mengerti</button>
                            </div>
                        </div>
                    )}
                    {showAuthModal && (
                        <AdminAuthModal showAlert={showAlert} onClose={() => { setShowAuthModal(false); setPendingAuthAction(null); }} onConfirm={() => { setShowAuthModal(false); if (pendingAuthAction) pendingAuthAction(); setPendingAuthAction(null); }} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
